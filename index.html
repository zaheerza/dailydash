<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Morning Brief</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

  :root {
    --ink: #0a0a0a;
    --paper: #ffffff;
    --mid: #555555;
    --faint: #999999;
    --border: #e0e0e0;
    --border-strong: #0a0a0a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; color-scheme: light; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* ── HEADER ─────────────────────────────────────────────────────────────── */
  .masthead {
    border-bottom: 1.5px solid var(--border-strong);
    padding: 32px 40px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    max-width: 1200px;
    margin: 0 auto;
  }

  .masthead-left { display: flex; flex-direction: column; gap: 6px; }

  .date-line {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--faint);
    text-transform: uppercase;
    font-weight: 500;
  }

  .site-title {
    font-size: 36px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .site-title span { font-weight: 300; color: var(--mid); }

  .masthead-right {
    text-align: right;
    font-size: 11px;
    color: var(--faint);
    line-height: 1.9;
  }

  /* ── LAYOUT ─────────────────────────────────────────────────────────────── */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
    display: grid;
    grid-template-columns: 1fr 320px;
  }

  .col-main { border-right: 1px solid var(--border); padding-right: 48px; }
  .col-side  { padding-left: 40px; }

  /* ── SECTIONS ───────────────────────────────────────────────────────────── */
  .section {
    padding: 36px 0;
    border-bottom: 1px solid var(--border);
  }
  .section:last-child { border-bottom: none; }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── QUOTE ──────────────────────────────────────────────────────────────── */
  .quote-block {
    padding: 28px 0 24px;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
  }
  .quote-text {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.55;
    margin-bottom: 14px;
  }
  .quote-source {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--faint);
    font-weight: 500;
    text-transform: uppercase;
  }

  /* ── NEWS ITEMS ─────────────────────────────────────────────────────────── */
  .feed-meta {
    font-size: 12px;
    color: var(--faint);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .news-item {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .news-item:last-child { border-bottom: none; }

  .news-source {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pw { /* paywall badge */
    font-size: 9px;
    border: 1px solid var(--border);
    color: var(--faint);
    padding: 1px 4px;
    letter-spacing: 0.05em;
  }

  .news-headline {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .news-headline a { color: inherit; text-decoration: none; }
  .news-headline a:hover { text-decoration: underline; }

  .news-summary {
    font-size: 13px;
    line-height: 1.65;
    color: var(--mid);
  }

  /* ── SIDEBAR ────────────────────────────────────────────────────────────── */
  .sidebar-section {
    padding: 28px 0;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section:last-child { border-bottom: none; }

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 18px;
  }

  /* ── MARKETS ────────────────────────────────────────────────────────────── */
  .market-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .market-item:last-child { border-bottom: none; }

  .market-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .market-right { text-align: right; }
  .market-price { font-size: 12px; font-weight: 600; }
  .market-chg   { font-size: 10px; margin-left: 5px; }
  .market-chg.up   { color: #2a7a2a; }
  .market-chg.down { color: #b53030; }
  .market-divider  { border: none; border-top: 1px solid var(--border); margin: 5px 0; }
  .ts { font-size: 9px; color: var(--faint); margin-top: 8px; letter-spacing: 0.04em; }

  /* ── COMPACT SIDEBAR ITEMS ──────────────────────────────────────────────── */
  .c-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .c-item:last-child { border-bottom: none; }

  .c-source {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 4px;
  }
  .c-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .c-title a { color: inherit; text-decoration: none; }
  .c-title a:hover { text-decoration: underline; }
  .c-sub { font-size: 11px; color: var(--mid); margin-top: 3px; line-height: 1.4; }

  /* ── GITHUB ─────────────────────────────────────────────────────────────── */
  .gh-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .gh-item:last-child { border-bottom: none; }
  .gh-name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .gh-name a { color: inherit; text-decoration: none; }
  .gh-name a:hover { text-decoration: underline; }
  .gh-desc { font-size: 11px; color: var(--mid); line-height: 1.45; margin-top: 3px; }
  .gh-meta { font-size: 10px; color: var(--faint); margin-top: 5px; display: flex; gap: 10px; }

  /* ── LOADING / ERROR ────────────────────────────────────────────────────── */
  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--faint);
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 16px 0;
  }
  .dots { display: flex; gap: 4px; }
  .dots span {
    width: 4px; height: 4px;
    background: var(--mid);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40%           { opacity: 1;   transform: scale(1);   }
  }
  .err { color: var(--mid); font-size: 12px; padding: 8px 0; }

  /* ── REFRESH BAR ────────────────────────────────────────────────────────── */
  .refresh-bar {
    display: flex;
    gap: 12px;
    padding: 28px 0 0;
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--ink);
    padding: 8px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: var(--ink); color: var(--paper); }

  /* ── MOBILE ─────────────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    body { padding: 0 0 48px; }
    .masthead { padding: 20px 16px 16px; flex-direction: column; align-items: flex-start; gap: 8px; }
    .masthead-right { text-align: left; }
    .site-title { font-size: 26px; }
    .page { padding: 0 16px; grid-template-columns: 1fr; }
    .col-main { border-right: none; padding-right: 0; }
    .col-side  { padding-left: 0; border-top: 1px solid var(--border); }
    .section   { padding: 24px 0; }
    .quote-text { font-size: 17px; }
    .refresh-bar { flex-wrap: wrap; }
    .refresh-btn { flex: 1; min-width: 120px; }
  }
</style>
</head>

const QUOTES = [

// ─── CACHE ────────────────────────────────────────────────────────────────────
const TODAY    = new Date().toDateString();
const CACHE_VER = 'v1';

function getCached(key) {
  try {
    const item = JSON.parse(localStorage.getItem(`mb_${CACHE_VER}_${key}`));
    return item?.date === TODAY ? item.value : null;
  } catch { return null; }
}

function setCache(key, value) {
  localStorage.setItem(`mb_${CACHE_VER}_${key}`, JSON.stringify({ date: TODAY, value }));
}

// ─── RSS FETCHING ─────────────────────────────────────────────────────────────
function parseXMLItems(xml, fallbackHost) {
  try {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.querySelector('parsererror')) return [];
    const feedTitle = doc.querySelector('channel > title')?.textContent?.trim() || fallbackHost;
    return [...doc.querySelectorAll('item')].slice(0, 10).map(item => ({
      title:   item.querySelector('title')?.textContent?.trim() || '',
      summary: (item.querySelector('description')?.textContent || '').replace(/<[^>]*>/g, '').trim().slice(0, 200),
      source:  feedTitle,
      link:    item.querySelector('link')?.textContent?.trim() || item.querySelector('guid')?.textContent?.trim() || '',
    })).filter(i => i.title);
  } catch { return []; }
}

async function fetchRSS(url) {
  const host = new URL(url).hostname;

  try {
    const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`, { signal: AbortSignal.timeout(6000) });
    if (r.ok) { const items = parseXMLItems(await r.text(), host); if (items.length) return items; }
  } catch {}

  try {
    const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, { signal: AbortSignal.timeout(6000) });
    if (r.ok) { const d = await r.json(); const items = parseXMLItems(d.contents || '', host); if (items.length) return items; }
  } catch {}

  try {
    const r = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&count=10`, { signal: AbortSignal.timeout(6000) });
    const d = await r.json();
    if (d.status === 'ok' && d.items?.length) {
      return d.items.map(i => ({
        title:   i.title,
        summary: (i.description || i.content || '').replace(/<[^>]*>/g, '').trim().slice(0, 200),
        source:  d.feed?.title || host,
        link:    i.link || i.guid || '',
      }));
    }
  } catch {}

  return [];
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
const PAYWALLED = ['ft.com', 'theglobeandmail.com', 'thestar.com', 'bloomberg.com', 'wsj.com', 'economist.com'];

function safeLink(url) {
  return /^https?:\/\//.test(url) ? url : '';
}

function paywallBadge(url) {
  try {
    const h = new URL(url).hostname.replace('www.', '');
    return PAYWALLED.some(d => h.endsWith(d)) ? '<span class="pw">$</span>' : '';
  } catch { return ''; }
}

function newsItemHTML(item) {
  const href = safeLink(item.link);
  const headline = href
    ? `<a href="${href}" target="_blank" rel="noopener">${item.title}</a>`
    : item.title;
  return `
    <div class="news-item">
      <div class="news-source">${item.source}${href ? paywallBadge(href) : ''}</div>
      <div class="news-headline">${headline}</div>
      ${item.summary ? `<div class="news-summary">${item.summary}</div>` : ''}
    </div>`;
}

function compactItemHTML(item) {
  const href = safeLink(item.link);
  const title = href
    ? `<a href="${href}" target="_blank" rel="noopener">${item.title}</a>`
    : item.title;
  return `
    <div class="c-item">
      <div class="c-source">${item.source}</div>
      <div class="c-title">${title}</div>
      ${item.summary ? `<div class="c-sub">${item.summary.slice(0, 100)}</div>` : ''}
    </div>`;
}

function loadingHTML() {
  return '<div class="loading"><div class="dots"><span></span><span></span><span></span></div></div>';
}

// ─── GENERIC SECTION LOADER ───────────────────────────────────────────────────
async function loadSection(id, feedUrls, maxItems, cacheKey, compact = false, force = false) {
  const el = document.getElementById(id);
  const cached = getCached(cacheKey);
  if (cached && !force) { el.innerHTML = cached; return; }

  el.innerHTML = loadingHTML();

  const results  = await Promise.allSettled(feedUrls.map(u => fetchRSS(u)));
  const rawItems = results.flatMap(r => r.status === 'fulfilled' ? r.value : []);

  if (!rawItems.length) {
    el.innerHTML = `<div class="err">No items loaded — feeds may be temporarily unreachable.</div>`;
    return;
  }

  // deduplicate by normalised title prefix
  const seen  = new Set();
  const items = [];
  for (const item of rawItems) {
    const key = item.title.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 40);
    if (!seen.has(key)) { seen.add(key); items.push(item); }
    if (items.length >= maxItems) break;
  }

  const sources = [...new Set(items.map(i => i.source))];
  const meta = `<div class="feed-meta">${sources.join(' · ')} · ${rawItems.length} articles scanned</div>`;
  const html = meta + items.map(i => compact ? compactItemHTML(i) : newsItemHTML(i)).join('');
  el.innerHTML = html;
  setCache(cacheKey, html);
}

// ─── QUOTE ────────────────────────────────────────────────────────────────────
function loadQuote() {
  const now   = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const day   = Math.floor((now - start) / 86400000);
  const q     = QUOTES[day % QUOTES.length];
  document.getElementById('quoteArea').innerHTML = `
    <div class="quote-block">
      <div class="quote-text">${q.text}</div>
      <div class="quote-source">${q.source}</div>
    </div>`;
}

// ─── MARKETS ──────────────────────────────────────────────────────────────────
const MARKET_SYMBOLS = [
  { sym: '^GSPC',    label: 'S&P 500',  group: 'index'     },
  { sym: '^GSPTSE',  label: 'TSX',      group: 'index'     },
  { sym: '^FTSE',    label: 'FTSE 100', group: 'index'     },
  { sym: '^J203.JO', label: 'JSE',      group: 'index'     },
  { sym: 'USDCAD=X', label: 'USD/CAD',  group: 'fx'        },
  { sym: 'USDZAR=X', label: 'USD/ZAR',  group: 'fx'        },
  { sym: 'GC=F',     label: 'Gold',     group: 'commodity' },
  { sym: 'SI=F',     label: 'Silver',   group: 'commodity' },
  { sym: 'PL=F',     label: 'Platinum', group: 'commodity' },
  { sym: 'CL=F',     label: 'WTI Oil',  group: 'commodity' },
  { sym: 'HG=F',     label: 'Copper',   group: 'commodity' },
];

async function loadMarkets() {
  const el = document.getElementById('marketsArea');
  try {
    const syms     = MARKET_SYMBOLS.map(s => s.sym).join(',');
    // v8/query2 avoids the crumb-token requirement introduced in v7/query1 (~2023)
    const yahooUrl = `https://query2.finance.yahoo.com/v8/finance/quote?symbols=${syms}&formatted=false&lang=en-US&region=US`;

    let quotes;

    try {
      const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`, { signal: AbortSignal.timeout(7000) });
      if (r.ok) { quotes = (await r.json()).quoteResponse?.result || []; }
    } catch {}

    if (!quotes?.length) {
      try {
        const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`, { signal: AbortSignal.timeout(7000) });
        if (r.ok) { const d = await r.json(); quotes = JSON.parse(d.contents || 'null')?.quoteResponse?.result || []; }
      } catch {}
    }

    if (!quotes?.length) {
      try {
        const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(yahooUrl)}`, { signal: AbortSignal.timeout(7000) });
        if (r.ok) { quotes = (await r.json()).quoteResponse?.result || []; }
      } catch {}
    }

    if (!quotes?.length) throw new Error('no data');

    const qMap = Object.fromEntries(quotes.map(q => [q.symbol, q]));
    let lastGroup = null;
    let html = '';

    for (const s of MARKET_SYMBOLS) {
      const q = qMap[s.sym];
      if (!q) continue;
      if (lastGroup && s.group !== lastGroup) html += '<hr class="market-divider">';
      lastGroup = s.group;

      const price  = q.regularMarketPrice;
      const chg    = q.regularMarketChangePercent ?? 0;
      const up     = chg >= 0;
      const priceStr = s.group === 'fx'
        ? price.toFixed(4)
        : price >= 1000 ? price.toLocaleString('en', { maximumFractionDigits: 0 }) : price.toFixed(2);

      html += `
        <div class="market-item">
          <div class="market-label">${s.label}</div>
          <div class="market-right">
            <span class="market-price">${priceStr}</span>
            <span class="market-chg ${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(chg).toFixed(2)}%</span>
          </div>
        </div>`;
    }

    const ts = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    html += `<div class="ts">Yahoo Finance · updated ${ts}</div>`;
    el.innerHTML = html;
  } catch {
    el.innerHTML = `<div class="err">Markets unavailable — Yahoo Finance may require disabling your ad blocker for this page.</div>`;
  }
}

// ─── GITHUB TRENDING ─────────────────────────────────────────────────────────
async function loadGitHub(force = false) {
  const el = document.getElementById('githubArea');
  const cached = getCached('github');
  if (cached && !force) { el.innerHTML = cached; return; }

  el.innerHTML = loadingHTML();
  try {
    const since = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
    const url   = `https://api.github.com/search/repositories?q=stars:>50+created:>${since}&sort=stars&order=desc&per_page=6`;
    const r     = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    const { items } = await r.json();
    if (!items?.length) throw new Error('empty');

    const html = items.map(repo => `
      <div class="gh-item">
        <div class="gh-name"><a href="${repo.html_url}" target="_blank" rel="noopener">${repo.full_name}</a></div>
        ${repo.description ? `<div class="gh-desc">${repo.description.slice(0, 110)}</div>` : ''}
        <div class="gh-meta">
          <span>★ ${repo.stargazers_count.toLocaleString()}</span>
          ${repo.language ? `<span>${repo.language}</span>` : ''}
          ${repo.topics?.length ? `<span>${repo.topics.slice(0, 2).join(', ')}</span>` : ''}
        </div>
      </div>`).join('') + `<div class="ts">GitHub Search API · new repos this week</div>`;

    el.innerHTML = html;
    setCache('github', html);
  } catch {
    el.innerHTML = `<div class="err">GitHub unavailable</div>`;
  }
}
